<meta name="keywords" content="결하다, 결혼 매칭, 결혼정보, 결혼정보회사, 소개팅 앱, 심리 매칭, 가치관 매칭, 결혼 앱, 신뢰 매칭" />

<meta property="og:description" content="사진과 조건 너머, 사람의 결을 보는 신뢰 기반 결혼 매칭 서비스." />

<style>
  :root{
    --lav-soft:#C8B6E2;
    --lav:#A88FCE;
    --lav-deep:#6B5B95;
    --sage:#B8C5B0;
    --ivory:#FAF7F2;
    --offwhite:#FFFEFB;
    --ink:#2C2A35;
    --mute:#6E6B78;
    --gold:#D8B76A;
  }
  html,body{ background:var(--offwhite); color:var(--ink); }
  body{ font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo','Noto Sans KR', sans-serif;
        letter-spacing:0.01em; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
        word-break:keep-all; overflow-wrap:break-word;}
  body.font-noto{ font-family:'Noto Sans KR', sans-serif; letter-spacing:0.005em;}
  ::selection{ background:#C8B6E2; color:#2C2A35; }

  .gh-display{ font-weight:600; letter-spacing:-0.015em; line-height:1.22; }
  .gh-h1{ font-size:clamp(36px,5.4vw,72px); font-weight:600; letter-spacing:-0.015em; line-height:1.18;}
  .gh-h2{ font-size:clamp(28px,3.6vw,46px); font-weight:600; letter-spacing:-0.012em; line-height:1.25;}
  .gh-h3{ font-size:clamp(20px,1.8vw,26px); font-weight:600; letter-spacing:-0.005em; line-height:1.35;}
  .eyebrow{ font-family:'Inter', ui-sans-serif; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--lav-deep);}
  .body-lg{ font-size:clamp(16px,1.1vw,18px); line-height:1.7; color:#3a3744;}
  .body{ font-size:16px; line-height:1.7; color:#3a3744;}
  .small{ font-size:13px; line-height:1.6; color:var(--mute);}

  .hairline{ box-shadow: inset 0 0 0 0.5px rgba(44,42,53,.12); }
  .card{ background:#fff; border:0.5px solid rgba(44,42,53,.08); border-radius:18px;}
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:11px; letter-spacing:.06em; font-family:'Inter',ui-sans-serif;}

  /* Soft lavender ↔ ivory gradient blocks */
  .bg-veil{
    background:
      radial-gradient(60% 50% at 20% 20%, rgba(200,182,226,.35), transparent 60%),
      radial-gradient(50% 50% at 85% 30%, rgba(184,197,176,.28), transparent 60%),
      linear-gradient(180deg, var(--ivory) 0%, var(--offwhite) 100%);
  }
  .bg-deep{
    background: linear-gradient(180deg, #2C2A35 0%, #221f2b 100%);
    color: #efeaf3;
  }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:12px; font-weight:500; font-size:15px; letter-spacing:.005em; transition:transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;}
  .btn-primary{ background:var(--lav-deep); color:#fff; }
  .btn-primary:hover{ background:#5a4c80; transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--ink); border:0.5px solid rgba(44,42,53,.18);}
  .btn-ghost:hover{ border-color:var(--lav-deep); color:var(--lav-deep);}
  .btn-sm{ padding:9px 14px; font-size:13px; border-radius:10px;}

  /* iOS / Play badges (drawn in CSS) */
  .store-btn{ display:inline-flex; align-items:center; gap:10px; padding:11px 18px 11px 16px; border-radius:12px; background:#1c1a23; color:#fff; min-width:200px;}
  .store-btn .small{ color:rgba(255,255,255,.65); font-size:11px; line-height:1; letter-spacing:.06em; text-transform:uppercase;}
  .store-btn .big{ font-size:16px; font-weight:600; letter-spacing:.005em; line-height:1.2;}
  .store-btn:hover{ background:#2a2733; }
  .store-btn.outline{ background:transparent; color:var(--ink); border:0.5px solid rgba(44,42,53,.22);}
  .store-btn.outline:hover{ border-color:var(--lav-deep); color:var(--lav-deep);}
  .store-btn.outline .small{ color:var(--mute);}

  /* Wave + circular signature */
  .signature-stage{ position:relative; aspect-ratio:1/1; width:100%; }
  .grain{ position:relative; }
  .grain::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:multiply;
    background-image: radial-gradient(rgba(0,0,0,.4) 0.6px, transparent 0.6px); background-size:3px 3px;}

  /* Section spacing */
  section{ padding-top:clamp(72px,9vw,140px); padding-bottom:clamp(72px,9vw,140px);}
  section.tight{ padding-top:clamp(56px,7vw,110px); padding-bottom:clamp(56px,7vw,110px);}

  /* Reveal on scroll */
  .reveal{ opacity:1; transform:none; transition:opacity .8s ease, transform .8s ease;}
  .reveal.is-in{ opacity:1; transform:none; }

  /* Sticky bottom CTA */
  .mobile-sticky{ position:fixed; left:12px; right:12px; bottom:12px; z-index:60; border-radius:16px;
    background:rgba(28,26,35,.92); color:#fff; padding:10px 12px; display:none; align-items:center; justify-content:space-between; gap:10px;
    backdrop-filter:blur(18px); box-shadow:0 12px 30px rgba(0,0,0,.18);}
  @media (max-width:768px){ .mobile-sticky{ display:flex; } }

  /* Comparison table */
  .cmp{ width:100%; border-collapse:separate; border-spacing:0; font-size:14.5px;}
  .cmp th, .cmp td{ padding:18px 18px; border-bottom:0.5px solid rgba(44,42,53,.10); text-align:left; vertical-align:top;}
  .cmp th{ font-weight:500; color:var(--mute); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; padding-bottom:14px; padding-top:14px;}
  .cmp td.row-label{ color:var(--mute); font-size:13px; width:22%;}
  .cmp .col-gh{ background: linear-gradient(180deg, rgba(200,182,226,.18), rgba(200,182,226,.08)); }
  .cmp .col-gh-head{ background: linear-gradient(180deg, rgba(107,91,149,1), rgba(107,91,149,.92)); color:#fff; border-radius:14px 14px 0 0;}
  .cmp tr:last-child td{ border-bottom:0;}
  .cmp tr:last-child td.col-gh{ border-radius:0 0 14px 14px;}
  @media (max-width:768px){ .cmp th, .cmp td{ padding:12px 10px; font-size:13px;} .cmp td.row-label{ width:30%;} }

  /* FAQ */
  details > summary{ list-style:none; cursor:pointer;}
  details > summary::-webkit-details-marker{ display:none;}
  details[open] .faq-q-icon{ transform:rotate(45deg);}
  .faq-q-icon{ transition:transform .25s ease;}

  /* Horizontal rule */
  .rule{ height:0.5px; background:rgba(44,42,53,.12); }

  /* Scroll-driven hero progress var */
  body{ --scroll-progress: 0; }

  /* === Pain point section — vertical tabs + detail === */
  .problem-layout{
    display:grid; grid-template-columns:1fr;
    background:#fff; border:0.5px solid rgba(44,42,53,.12);
    border-radius:24px;
  }
  @media (min-width:860px){ .problem-layout{ grid-template-columns:minmax(0,.92fr) minmax(0,1.28fr); } }

  .problem-list{
    padding:18px; display:flex; flex-direction:column; gap:4px;
    position:relative;
  }
  @media (min-width:860px){ .problem-list{ padding:26px 24px; } }
  .problem-item{
    text-align:left; width:100%; position:relative;
    border-radius:16px; padding:18px 20px;
    border:1px solid transparent;
    display:flex; flex-direction:column; gap:12px;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .problem-item:hover{ background:rgba(44,42,53,.035); }
  .problem-item.is-active{
    border:1px solid #6B5B95; background:#fff;
    box-shadow:0 12px 30px rgba(107,91,149,.13);
  }
  .problem-item-head{ display:flex; align-items:center; gap:14px; }
  .problem-item-iconbox{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:grid; place-items:center;
    background:rgba(44,42,53,.05); color:rgba(44,42,53,.42);
    transition:background .25s ease, color .25s ease;
  }
  .problem-item.is-active .problem-item-iconbox{ background:rgba(107,91,149,.1); color:#6B5B95; }
  .problem-item-title{
    font-size:16.5px; font-weight:600; line-height:1.35;
    color:rgba(44,42,53,.6);
  }
  .problem-item.is-active .problem-item-title{ color:#6B5B95; }
  .problem-item-desc{
    font-size:14.5px; line-height:1.65; color:#6E6B78;
    padding-left:56px; margin:0;
  }
  .problem-item-arrow{
    position:absolute; right:-21px; top:31px;
    width:42px; height:42px; border-radius:50%;
    background:#6B5B95; color:#fff;
    display:grid; place-items:center; z-index:4;
    box-shadow:0 8px 20px rgba(107,91,149,.3);
  }
  @media (max-width:859px){
    .problem-item-arrow{ right:50%; top:auto; bottom:-21px; transform:translateX(50%) rotate(90deg); }
  }

  .problem-detail{
    background:linear-gradient(135deg, rgba(200,182,226,.18), rgba(200,182,226,.04));
    padding:30px 26px; display:flex; flex-direction:column; gap:30px;
    border-radius:0 0 24px 24px;
  }
  @media (min-width:860px){ .problem-detail{ padding:40px 44px; border-radius:0 24px 24px 0; } }
  .problem-detail-head{ display:flex; align-items:center; gap:14px; }
  /* Desktop: all tab bodies stack in one grid cell so the cell sizes to the
     tallest tab — keeps the pinned panel a fixed height. Mobile: only the
     active body renders, so each tab takes its own height with no empty gap. */
  .problem-detail-stack > .problem-detail-body{ display:none; }
  .problem-detail-stack > .problem-detail-body.is-active{ display:flex; }
  @media (min-width:860px){
    .problem-detail-stack{ display:grid; flex:1 1 auto; }
    .problem-detail-stack > .problem-detail-body{ display:flex; grid-area:1 / 1; opacity:0; visibility:hidden; transition:opacity .22s ease; pointer-events:none; }
    .problem-detail-stack > .problem-detail-body.is-active{ opacity:1; visibility:visible; pointer-events:auto; }
  }
  .problem-detail-iconbox{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:grid; place-items:center; background:#6B5B95; color:#fff;
  }
  .problem-detail-body{
    display:flex; flex-direction:column; gap:24px; align-items:center;
    margin:auto 0;
  }
  @media (min-width:860px){
    .problem-detail-body{ flex-direction:row; gap:28px; align-items:center; }
    .problem-detail-text{ flex:1 1 38%; min-width:0; }
    .problem-detail-phone{ flex:0 0 auto; }
  }
  .problem-detail-sub{ font-size:15px; line-height:1.65; color:rgba(44,42,53,.72); margin-top:12px; }
  .problem-detail-cap{ font-family:'Inter',ui-sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(107,91,149,.7); margin-top:14px; text-align:center; }

  /* Frameless screen crop (Problem→Solution app screens) */
  .screen-crop{
    position:relative; width:320px; height:500px;
    border-radius:20px; overflow:hidden;
    background:#fff; border:0.5px solid rgba(44,42,53,.08);
    box-shadow:0 30px 60px -28px rgba(107,91,149,.32), 0 8px 24px -12px rgba(44,42,53,.12);
  }
  .screen-crop img{ width:100%; height:auto; display:block; }
  .screen-crop::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:72px;
    background:linear-gradient(to top, #fff 12%, rgba(255,255,255,0));
    pointer-events:none;
  }
  @media (max-width:520px){ .screen-crop{ width:100%; height:auto; aspect-ratio:32/50; } }

  /* Two-screen variant: text on top, two cards side by side below */
  @media (min-width:860px){
    .problem-detail-body.is-dual{ flex-direction:column; align-items:stretch; gap:22px; }
    .problem-detail-body.is-dual .problem-detail-text{ flex:0 0 auto; }
    .problem-detail-body.is-dual .problem-detail-phone{ width:100%; }
  }
  .screen-pair{ display:flex; flex-direction:row; gap:16px; align-items:flex-start; justify-content:center; }
  .screen-pair .screen-crop{ flex:1 1 0; width:auto; height:440px; }
  @media (max-width:520px){
    .screen-pair{ flex-direction:column; align-items:center; }
    .screen-pair .screen-crop{ flex:none; width:100%; height:auto; aspect-ratio:32/46; }
  }

  /* Pricing card (Problem→Solution tab 04) */
  .price-card{
    width:280px; background:#fff; border:0.5px solid rgba(44,42,53,.08);
    border-radius:22px; padding:26px 26px 22px;
    box-shadow:0 30px 60px -30px rgba(107,91,149,.35), 0 8px 24px -12px rgba(44,42,53,.12);
  }
  .price-card-cup{
    width:72px; height:72px; border-radius:18px; margin-bottom:20px;
    display:grid; place-items:center;
    background:linear-gradient(150deg, rgba(200,182,226,.32), rgba(200,182,226,.08));
  }
  .price-card-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .price-card-label{ font-size:13px; color:var(--mute); margin-bottom:4px; }
  .price-card-amount{ font-size:30px; font-weight:700; letter-spacing:-0.02em; color:#2C2A35; line-height:1.1; }
  .price-card-rule{ height:1px; background:rgba(44,42,53,.08); margin:18px 0; }
  .price-card-note{ font-size:12.5px; line-height:1.55; color:var(--mute); margin-top:14px; }

  /* === Process section — timeline + preview cards === */
  .process-timeline{ list-style:none; margin:0; padding:0; }
  .process-step{ display:grid; grid-template-columns:30px minmax(0,1fr); column-gap:18px; }
  .process-step-rail{ display:flex; flex-direction:column; align-items:center; }
  .process-step-num{
    font-family:'Inter',ui-sans-serif; font-size:12px; font-weight:600; letter-spacing:.08em;
    color:#6B5B95; line-height:1; padding-top:3px;
  }
  .process-step-line{
    flex:1 1 auto; display:flex; align-items:center; justify-content:center;
    min-height:26px; color:rgba(107,91,149,.35);
  }
  .process-step-content{
    display:flex; flex-wrap:wrap; align-items:baseline; column-gap:18px; row-gap:2px;
    padding-bottom:26px;
  }
  .process-step:last-child .process-step-content{ padding-bottom:0; }
  .process-step-title{ font-size:17px; font-weight:600; color:#2C2A35; min-width:96px; }
  .process-step-desc{ font-size:14px; line-height:1.6; color:#6E6B78; margin:0; }

  .process-preview{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;
  }
  @media (max-width:640px){ .process-preview{ grid-template-columns:1fr; gap:16px; } }
  .process-preview-card{
    background:linear-gradient(180deg, rgba(200,182,226,.10), rgba(200,182,226,.02));
    border:0.5px solid rgba(44,42,53,.08);
    border-radius:18px;
    padding:20px 14px 18px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .process-preview-phone{ margin-bottom:14px; }
  .process-preview-label{
    font-family:'Inter',ui-sans-serif; font-size:10.5px; letter-spacing:.14em; color:#6B5B95;
    text-transform:uppercase; margin-bottom:5px;
  }
  .process-preview-title{ font-size:14px; font-weight:600; color:#2C2A35; }

  /* === Trust panels === */
  .trust-panel{
    background:rgba(44,42,53,.025);
    border:0.5px solid rgba(44,42,53,.07);
    border-radius:16px;
    padding:22px 24px;
  }

  /* === Header polish === */
  .site-header{
    background:rgba(255,254,251,.88);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:0.5px solid rgba(44,42,53,.1);
    transition:box-shadow .3s ease, background .3s ease;
  }
  .site-header.is-scrolled{ background:rgba(255,254,251,.95); box-shadow:0 2px 14px rgba(44,42,53,.05); }
  .site-header-inner{ display:flex; align-items:center; height:64px; }
  .site-header-nav{ display:none; flex:1 1 0%; align-items:center; justify-content:center; gap:32px; font-size:14px; color:rgba(44,42,53,.75); }
  @media (min-width:768px){ .site-header-nav{ display:flex; } }
  .site-header-nav a:hover{ color:#6B5B95; }
  .site-header-right{ display:flex; align-items:center; gap:12px; margin-left:auto; }
  @media (min-width:768px){ .site-header-right{ margin-left:0; } }
  </style>

  console.error(e.message);
});
</script>
