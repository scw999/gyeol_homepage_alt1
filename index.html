<meta property="og:title" content="결하다 — 결혼을 위한 만남은 결이 맞아야 합니다" />

<style>
  :root{
    --lav-soft:#C8B6E2;
    --lav:#A88FCE;
    --lav-deep:#6B5B95;
    --sage:#B8C5B0;
    --ivory:#FAF7F2;
    --offwhite:#FFFEFB;
    --ink:#2C2A35;
    --mute:#6E6B78;
    --gold:#D8B76A;
  }
  html,body{ background:var(--offwhite); color:var(--ink); }
  body{ font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo','Noto Sans KR', sans-serif;
        letter-spacing:0.01em; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  body.font-noto{ font-family:'Noto Sans KR', sans-serif; letter-spacing:0.005em;}
  ::selection{ background:#C8B6E2; color:#2C2A35; }

  .gh-display{ font-weight:600; letter-spacing:-0.015em; line-height:1.22; }
  .gh-h1{ font-size:clamp(36px,5.4vw,72px); font-weight:600; letter-spacing:-0.015em; line-height:1.18;}
  .gh-h2{ font-size:clamp(28px,3.6vw,46px); font-weight:600; letter-spacing:-0.012em; line-height:1.25;}
  .gh-h3{ font-size:clamp(20px,1.8vw,26px); font-weight:600; letter-spacing:-0.005em; line-height:1.35;}
  .eyebrow{ font-family:'Inter', ui-sans-serif; font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--lav-deep);}
  .body-lg{ font-size:clamp(16px,1.1vw,18px); line-height:1.7; color:#3a3744;}
  .body{ font-size:16px; line-height:1.7; color:#3a3744;}
  .small{ font-size:13px; line-height:1.6; color:var(--mute);}

  .hairline{ box-shadow: inset 0 0 0 0.5px rgba(44,42,53,.12); }
  .card{ background:#fff; border:0.5px solid rgba(44,42,53,.08); border-radius:18px;}
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:11px; letter-spacing:.06em; font-family:'Inter',ui-sans-serif;}

  /* Soft lavender ↔ ivory gradient blocks */
  .bg-veil{
    background:
      radial-gradient(60% 50% at 20% 20%, rgba(200,182,226,.35), transparent 60%),
      radial-gradient(50% 50% at 85% 30%, rgba(184,197,176,.28), transparent 60%),
      linear-gradient(180deg, var(--ivory) 0%, var(--offwhite) 100%);
  }
  .bg-deep{
    background: linear-gradient(180deg, #2C2A35 0%, #221f2b 100%);
    color: #efeaf3;
  }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:12px; font-weight:500; font-size:15px; letter-spacing:.005em; transition:transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;}
  .btn-primary{ background:var(--lav-deep); color:#fff; }
  .btn-primary:hover{ background:#5a4c80; transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--ink); border:0.5px solid rgba(44,42,53,.18);}
  .btn-ghost:hover{ border-color:var(--lav-deep); color:var(--lav-deep);}
  .btn-sm{ padding:9px 14px; font-size:13px; border-radius:10px;}

  /* iOS / Play badges (drawn in CSS) */
  .store-btn{ display:inline-flex; align-items:center; gap:10px; padding:11px 18px 11px 16px; border-radius:12px; background:#1c1a23; color:#fff; min-width:200px;}
  .store-btn .small{ color:rgba(255,255,255,.65); font-size:11px; line-height:1; letter-spacing:.06em; text-transform:uppercase;}
  .store-btn .big{ font-size:16px; font-weight:600; letter-spacing:.005em; line-height:1.2;}
  .store-btn:hover{ background:#2a2733; }
  .store-btn.outline{ background:transparent; color:var(--ink); border:0.5px solid rgba(44,42,53,.22);}
  .store-btn.outline:hover{ border-color:var(--lav-deep); color:var(--lav-deep);}
  .store-btn.outline .small{ color:var(--mute);}

  /* Wave + circular signature */
  .signature-stage{ position:relative; aspect-ratio:1/1; width:100%; }
  .grain{ position:relative; }
  .grain::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:multiply;
    background-image: radial-gradient(rgba(0,0,0,.4) 0.6px, transparent 0.6px); background-size:3px 3px;}

  /* Section spacing */
  section{ padding-top:clamp(72px,9vw,140px); padding-bottom:clamp(72px,9vw,140px);}
  section.tight{ padding-top:clamp(56px,7vw,110px); padding-bottom:clamp(56px,7vw,110px);}

  /* Reveal on scroll */
  .reveal{ opacity:1; transform:none; transition:opacity .8s ease, transform .8s ease;}
  .reveal.is-in{ opacity:1; transform:none; }

  /* Sticky bottom CTA */
  .mobile-sticky{ position:fixed; left:12px; right:12px; bottom:12px; z-index:60; border-radius:16px;
    background:rgba(28,26,35,.92); color:#fff; padding:10px 12px; display:none; align-items:center; justify-content:space-between; gap:10px;
    backdrop-filter:blur(18px); box-shadow:0 12px 30px rgba(0,0,0,.18);}
  @media (max-width:768px){ .mobile-sticky{ display:flex; } }

  /* Comparison table */
  .cmp{ width:100%; border-collapse:separate; border-spacing:0; font-size:14.5px;}
  .cmp th, .cmp td{ padding:18px 18px; border-bottom:0.5px solid rgba(44,42,53,.10); text-align:left; vertical-align:top;}
  .cmp th{ font-weight:500; color:var(--mute); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; padding-bottom:14px; padding-top:14px;}
  .cmp td.row-label{ color:var(--mute); font-size:13px; width:22%;}
  .cmp .col-gh{ background: linear-gradient(180deg, rgba(200,182,226,.18), rgba(200,182,226,.08)); }
  .cmp .col-gh-head{ background: linear-gradient(180deg, rgba(107,91,149,1), rgba(107,91,149,.92)); color:#fff; border-radius:14px 14px 0 0;}
  .cmp tr:last-child td{ border-bottom:0;}
  .cmp tr:last-child td.col-gh{ border-radius:0 0 14px 14px;}
  @media (max-width:768px){ .cmp th, .cmp td{ padding:12px 10px; font-size:13px;} .cmp td.row-label{ width:30%;} }

  /* FAQ */
  details > summary{ list-style:none; cursor:pointer;}
  details > summary::-webkit-details-marker{ display:none;}
  details[open] .faq-q-icon{ transform:rotate(45deg);}
  .faq-q-icon{ transition:transform .25s ease;}

  /* Horizontal rule */
  .rule{ height:0.5px; background:rgba(44,42,53,.12); }

  /* Scroll-driven hero progress var */
  body{ --scroll-progress: 0; }

  /* === Pain point section === */
  .problem-tabs{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem; }
  @media (min-width:768px){ .problem-tabs{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:.75rem; } }
  .problem-tab{
    text-align:left; width:100%;
    padding:16px 18px; border-radius:14px;
    background:rgba(44,42,53,.03);
    border:0.5px solid rgba(44,42,53,.10);
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    display:flex; flex-direction:column; gap:8px;
  }
  .problem-tab:hover{ background:rgba(44,42,53,.05); border-color:rgba(107,91,149,.28); }
  .problem-tab[data-active="1"]{
    background:linear-gradient(135deg, rgba(200,182,226,.32), rgba(200,182,226,.08));
    border:1px solid #6B5B95;
    box-shadow:0 10px 28px rgba(107,91,149,.16);
    transform:translateY(-1px);
  }
  .problem-tab-num{
    font-family:'Inter',ui-sans-serif; font-size:11px; letter-spacing:.16em;
    color:rgba(44,42,53,.5);
  }
  .problem-tab[data-active="1"] .problem-tab-num{ color:#6B5B95; }
  .problem-tab-text{
    font-weight:500; font-size:14px; line-height:1.4;
    color:rgba(44,42,53,.65);
  }
  .problem-tab[data-active="1"] .problem-tab-text{ color:#2C2A35; font-weight:600; }

  .problem-compare{
    display:grid; grid-template-columns:1fr;
    background:#fff; border:0.5px solid rgba(44,42,53,.08);
    border-radius:18px; overflow:hidden;
  }
  @media (min-width:768px){ .problem-compare{ grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); } }
  .problem-pane{ padding:28px 24px; }
  @media (min-width:768px){ .problem-pane{ padding:40px 36px; } }
  .problem-pane-bad{ background:rgba(44,42,53,.025); }
  .problem-pane-good{ background:linear-gradient(135deg, rgba(200,182,226,.18), rgba(200,182,226,.04)); }
  .problem-pane-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .problem-icon{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; flex-shrink:0; }
  .problem-icon-bad{ background:rgba(44,42,53,.08); color:rgba(44,42,53,.5); }
  .problem-icon-good{ background:#6B5B95; color:#fff; }
  .problem-title-bad{ font-size:20px; font-weight:600; line-height:1.3; color:rgba(44,42,53,.55); }
  @media (min-width:768px){ .problem-title-bad{ font-size:22px; } }
  .problem-sub{ font-size:15px; line-height:1.65; color:#6E6B78; margin-top:10px; }
  .problem-sub-good{ color:rgba(44,42,53,.75); }
  .problem-compare-arrow{
    display:flex; align-items:center; justify-content:center;
    padding:4px 0; background:#fff;
  }
  @media (min-width:768px){ .problem-compare-arrow{ padding:0 12px; } }
  .problem-arrow-circle{
    width:42px; height:42px; border-radius:50%;
    background:#6B5B95; color:#fff;
    display:grid; place-items:center;
    transform:rotate(90deg);
  }
  @media (min-width:768px){ .problem-arrow-circle{ transform:none; } }

  /* === Header polish === */
  .site-header{
    background:rgba(255,254,251,.88);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:0.5px solid rgba(44,42,53,.1);
    transition:box-shadow .3s ease, background .3s ease;
  }
  .site-header.is-scrolled{ background:rgba(255,254,251,.95); box-shadow:0 2px 14px rgba(44,42,53,.05); }
  .site-header-inner{ display:flex; align-items:center; height:64px; }
  .site-header-nav{ display:none; flex:1 1 0%; align-items:center; justify-content:center; gap:32px; font-size:14px; color:rgba(44,42,53,.75); }
  @media (min-width:768px){ .site-header-nav{ display:flex; } }
  .site-header-nav a:hover{ color:#6B5B95; }
  .site-header-right{ display:flex; align-items:center; gap:12px; margin-left:auto; }
  @media (min-width:768px){ .site-header-right{ margin-left:0; } }
  </style>

<script>
window.addEventListener('error', e => {
  const msg = 'ERROR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno;
  document.body.insertAdjacentHTML('afterbegin', '<pre style="position:fixed;top:0;left:0;right:0;z-index:9999;color:#fff;background:#c00;padding:8px;font:12px monospace;margin:0;white-space:pre-wrap">'+msg+'</pre>');
  console.error(e.message);
});
</script>
